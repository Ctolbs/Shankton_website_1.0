<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-DZJH5ZXZT2"></script>
  <script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}gtag('js',new Date());gtag('config','G-DZJH5ZXZT2');</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tenor+Sans&family=Inter:wght@400;500&display=swap">
  <title>Shankton Properties</title>
  <meta name="description" content="Rare places, well kept. Homes on Nicaragua's Emerald Coast and in Long Beach, California.">
  <meta name="robots" content="noindex">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <meta name="theme-color" content="#0B0F0E">
  <style>
    :root { --obsidian:#0B0F0E; --emerald:#1A332F; --tide:#3A6560; --sand:#D4B98C; --bone:#F5F1E8; }
    * { box-sizing:border-box; margin:0; padding:0; }
    body { background:var(--obsidian); color:var(--bone); font-family:Inter, system-ui, sans-serif; min-height:100vh; }
    main { max-width:440px; margin:0 auto; padding:48px 16px 40px; text-align:center; }
    .mark { width:44px; height:57px; margin:0 auto 18px; display:block; }
    h1 { font-family:'Tenor Sans', serif; font-weight:400; font-size:26px; letter-spacing:.06em; }
    .tag { color:var(--sand); font-size:11px; letter-spacing:.28em; text-transform:uppercase; margin:10px 0 36px; }
    a { color:inherit; text-decoration:none; }
    .home { position:relative; display:block; height:150px; margin-bottom:12px; overflow:hidden; border:1px solid rgba(212,185,140,.18); }
    .home img { width:100%; height:100%; object-fit:cover; display:block; transition:transform .6s ease; }
    .home:hover img { transform:scale(1.04); }
    .home span { position:absolute; left:0; right:0; bottom:0; padding:28px 16px 12px; text-align:left;
      background:linear-gradient(transparent, rgba(11,15,14,.85)); font-family:'Tenor Sans', serif; font-size:18px; letter-spacing:.04em; }
    .home small { display:block; font-family:Inter, sans-serif; font-size:11px; letter-spacing:.18em; text-transform:uppercase; color:var(--sand); margin-top:3px; }
    .btn { display:block; padding:15px 16px; margin-top:12px; border:1px solid var(--tide); font-size:13px; letter-spacing:.16em; text-transform:uppercase; transition:background .2s; }
    .btn:hover { background:var(--emerald); }
    .btn.primary { background:var(--bone); color:var(--obsidian); border-color:var(--bone); }
    .btn.primary:hover { background:var(--sand); border-color:var(--sand); }
    footer { margin-top:36px; font-size:11px; color:rgba(245,241,232,.45); letter-spacing:.08em; }
  </style>
</head>
<body>
  <main>
    <svg class="mark" viewBox="0 0 56 72" aria-hidden="true">
      <polygon points="28,0 48,18 48,52 28,72 8,52 8,18" fill="#1A332F"/>
      <polygon points="28,0 48,18 28,24" fill="#3A6560"/>
      <polygon points="28,0 8,18 28,24" fill="#2A4A45"/>
      <polygon points="8,52 28,24 28,72" fill="#3A6560" opacity="0.8"/>
      <polygon points="28,24 8,18 48,18" fill="#4A7570" opacity="0.6"/>
    </svg>
    <h1>SHANKTON</h1>
    <p class="tag">Rare places, well kept.</p>

    <a class="home" href="/tower/?utm_source=instagram&amp;utm_medium=social&amp;utm_campaign=bio">
      <img src="/images/nica/tower/pool-infinity.jpg" alt="Shankton Tower infinity pool above the Pacific" loading="eager">
      <span>Tower<small>Nicaragua</small></span>
    </a>
    <a class="home" href="/harbour/?utm_source=instagram&amp;utm_medium=social&amp;utm_campaign=bio">
      <img src="/images/nica/harbour/hero.jpg" alt="Shankton Harbour, Playa Gigante" loading="lazy">
      <span>Harbour<small>Nicaragua</small></span>
    </a>
    <a class="home" href="/peninsula/?utm_source=instagram&amp;utm_medium=social&amp;utm_campaign=bio">
      <img src="/images/lgb/rooftop-bay.jpg" alt="Shankton Peninsula rooftop, Long Beach" loading="lazy">
      <span>Peninsula<small>Long Beach, California</small></span>
    </a>

    <a class="btn primary" href="/?utm_source=instagram&amp;utm_medium=social&amp;utm_campaign=bio#collection">Reserve direct</a>
    <a class="btn" href="/guides/getting-to-playa-gigante/?utm_source=instagram&amp;utm_medium=social&amp;utm_campaign=bio">Getting to Nicaragua</a>
    <a class="btn" href="mailto:contact@shankton.com">Write to us</a>

    <footer>shankton.com</footer>
  </main>
</body>
</html>
