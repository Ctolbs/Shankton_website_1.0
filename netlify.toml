[build]
  publish = "."
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[build.environment]
  NODE_VERSION = "18"

# Collapse index.html duplicates to clean canonical URLs (fixes GSC
# "Alternate page with proper canonical tag")
[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/:p1/index.html"
  to = "/:p1/"
  status = 301
  force = true

[[redirects]]
  from = "/:p1/:p2/index.html"
  to = "/:p1/:p2/"
  status = 301
  force = true

[[redirects]]
  from = "/booking-success"
  to = "/booking-success.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
